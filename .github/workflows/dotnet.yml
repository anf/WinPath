name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore WinPath.sln

      - name: Build
        run: dotnet build WinPath.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WinPath.sln --configuration Release --no-build --verbosity normal

      - name: Publish (win-x64)
        run: dotnet publish WinPath/WinPath.csproj -c Release -r win-x64 -p:PublishReadyToRun=true -p:PublishSingleFile=false -p:UseAppHost=true --self-contained false
